<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b32"><link rel="manifest" href="manifest.webmanifest"><title>Un día, una virtud</title><style>body{margin:0;background:#14272e;color:#f3ead8;font-family:Georgia,serif;min-height:100vh;display:grid;place-items:center}main{width:min(90%,520px);text-align:center;padding:30px 0}.small{font:12px system-ui;letter-spacing:3px;color:#c9aa75;text-transform:uppercase}h1{font-size:36px;font-weight:normal}blockquote{font-size:clamp(25px,6vw,37px);line-height:1.35;margin:40px 0 20px}#author{color:#d5b47d;font:15px system-ui}button,input{padding:13px;border-radius:8px;border:1px solid #a88e66;background:transparent;color:inherit;font:16px system-ui}button{cursor:pointer;margin:6px}input{width:70%;margin-bottom:12px}#welcome{display:none}#date{font:13px system-ui;color:#b6c1bd}#foot{font:12px system-ui;color:#9caaa7;margin-top:35px}</style></head><body><main><div class="small">Sabiduría para cada día</div><h1>Un día, una virtud</h1><section id="welcome"><p>¿Cómo te llamas?</p><input id="name" placeholder="Tu nombre" maxlength="40"><br><button id="save">Comenzar</button></section><section id="daily" hidden><p id="greet"></p><p id="date"></p><blockquote id="quote"></blockquote><p id="author"></p><p id="type" style="font:12px system-ui;color:#9caaa7"></p><button id="favorite">♡ Guardar</button><button id="share">Compartir</button><button id="rename">Cambiar nombre</button><p id="foot">Una reflexión diaria · Sin anuncios</p></section><p id="status" style="font:12px system-ui"></p></main><script src="app.js"></script></body></html>
